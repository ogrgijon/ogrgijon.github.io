title: "The Merekai Project"
description: "Ideas, projects and perspectives on technology, culture and the future."
url: "https://merekai.es"
baseurl: ""
lang: "en"
timezone: "Europe/Madrid"
markdown: kramdown
permalink: /journal/:year/:month/:day/:title/
future: false
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      lang: en
      image: /assets/images/article-default.svg
  - scope:
      path: ""
      type: "posts"
    values:
      layout: article
      author: "The Merekai Project"
      image: /assets/images/article-default.svg
      lang: en
  - scope:
      path: ""
      type: "projects"
    values:
      layout: page
      lang: en
      image: /assets/images/article-default.svg
collections:
  projects:
    output: true
    permalink: /projects/:name/
